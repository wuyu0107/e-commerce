{% extends 'base.html' %}
{% load static %}
{% block content %}
{% include 'navbar.html' %}

<!-- Box Container -->
<div class="bg-transparent p-8 rounded-lg mb-8">
    <h2 class="text-lg font-semibold text-indigo-700"></h2>
    <p class="text-sm text-gray-600"></p>
</div>

<h1>Edit Entry</h1>

<form method="POST">
    {% csrf_token %}
    <table>
        {{ form.as_table }}
        <tr>
            <td></td>
            <td>
                <button type="submit" class="mt-4 bg-teal-600 text-white font-bold py-2 px-4 rounded-lg transition duration-300">
                    Edit Note Entry
                </button>
            </td>
        </tr>
    </table>
</form>

{% endblock %}
